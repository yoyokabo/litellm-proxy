# LiteLLM proxy config for the local stand-in deployment.
#
# The `guardrails` block is the only part of this file that is product. It is
# reproduced verbatim from services/litellm-pii-guardrail/README.md and is what
# a site would paste into the config.yaml it already has.

model_list:
  # Ollama on the host. A real deployment has vLLM/Qwen3 here; the guardrail
  # runs pre_call and never sees the model, so the substitution is invisible
  # to everything under test.
  - model_name: local-llama
    litellm_params:
      model: ollama_chat/llama3.1:latest
      # Port 11435 is the relay, not ollama itself -- see ollama-relay in compose.
      api_base: http://host.docker.internal:11435

  # Test fixture. Echoes the request back, so a test can assert on the text the
  # provider was handed instead of on an 8B model's willingness to repeat it.
  - model_name: echo
    litellm_params:
      model: openai/echo
      api_base: http://echo-provider:8099/v1
      api_key: unused

guardrails:
  - guardrail_name: "pii-ar"
    litellm_params:
      guardrail: pii_guardrail.ArabicPIIGuardrail
      mode: "pre_call"
      service_url: http://pii-service:8090
      default_on: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  # The proxy's own logs are not an audit trail and must not become one. Our
  # rows go to pii-service; this keeps prompts out of LiteLLM's spend logs,
  # which is the partition brief 6 asks for on this side of the wire.
  turn_off_message_logging: true
