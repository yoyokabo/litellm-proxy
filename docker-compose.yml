# pii-service and its database, joining the LiteLLM deployment that already
# exists (brief §3, done-criterion 1).
#
# The `litellm` network is declared external on purpose: this compose file
# attaches to a running deployment, it does not own it. If your LiteLLM stack
# named its network something else, override it:
#
#     LITELLM_NETWORK=my_stack_default docker compose up -d
#
# Find the name with:  docker network ls
#
# pii-db is a SEPARATE Postgres instance from LiteLLM's. The brief is explicit
# that LiteLLM's own database is not to be touched, and separation is also what
# lets the audit data have its own backup, retention and access policy -- which
# for a table that exists to satisfy auditors is the point.

name: pii-guardrail

services:
  pii-db:
    image: postgres:16-alpine
    container_name: pii-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PII_DB_USER:-pii}
      POSTGRES_PASSWORD: ${PII_DB_PASSWORD:?set PII_DB_PASSWORD in .env}
      POSTGRES_DB: ${PII_DB_NAME:-pii}
      # Deterministic collation, so ORDER BY on an Arabic key does not depend
      # on the host's locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pii-db-data:/var/lib/postgresql/data
    networks:
      - pii-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PII_DB_USER:-pii} -d ${PII_DB_NAME:-pii}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not published to the host. Only pii-service needs to reach it, and an
    # audit database on a host port is an audit database somebody will query
    # from their laptop.
    expose:
      - "5432"

  pii-migrate:
    build:
      context: ./services/pii-service
      secrets: [pip_ca]
    image: pii-service:${PII_IMAGE_TAG:-0.1.0}
    container_name: pii-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      PII_DATABASE_URL: >-
        postgresql+psycopg://${PII_DB_USER:-pii}:${PII_DB_PASSWORD}@pii-db:5432/${PII_DB_NAME:-pii}
      # Migrations do not fingerprint anything, but Settings validates the
      # pepper on import, so the container needs a valid one to start.
      PII_AUDIT_PEPPER: ${PII_AUDIT_PEPPER:?set PII_AUDIT_PEPPER in .env}
    depends_on:
      pii-db:
        condition: service_healthy
    networks:
      - pii-internal

  pii-service:
    build:
      context: ./services/pii-service
      secrets: [pip_ca]
    image: pii-service:${PII_IMAGE_TAG:-0.1.0}
    container_name: pii-service
    restart: unless-stopped
    environment:
      PII_DATABASE_URL: >-
        postgresql+psycopg://${PII_DB_USER:-pii}:${PII_DB_PASSWORD}@pii-db:5432/${PII_DB_NAME:-pii}
      # The service refuses to start if this is unset, empty, the value from
      # .env.example, or shorter than 32 characters. See README.
      PII_AUDIT_PEPPER: ${PII_AUDIT_PEPPER:?set PII_AUDIT_PEPPER in .env}
      PII_LOG_LEVEL: ${PII_LOG_LEVEL:-INFO}
      PII_LANGUAGES: ${PII_LANGUAGES:-en,ar}
      PII_ENABLE_TIER2_ARABIC_NER: ${PII_ENABLE_TIER2_ARABIC_NER:-false}
      PII_ENABLE_TIER3_GLINER: ${PII_ENABLE_TIER3_GLINER:-false}
      PII_TIER2_MODEL_DIR: ${PII_TIER2_MODEL_DIR:-/models/arabic-ner}
      PII_DETECTION_CACHE_SIZE: ${PII_DETECTION_CACHE_SIZE:-2048}
      # Empty disables the /admin routes. See .env.example.
      PII_ADMIN_TOKEN: ${PII_ADMIN_TOKEN:-}
    volumes:
      # Policy is config, not code: compliance edits these and restarts the
      # service, without rebuilding an image.
      - ./services/pii-service/config:/app/config:ro
      # The fail-open spill. A named volume, because losing it means losing
      # audit records that the database had not accepted yet.
      - pii-wal:/var/lib/pii-service/wal
      # Phase 4 bakes the weights into the image; until then, mount them.
      - ${PII_MODEL_HOST_DIR:-./models}:/models:ro
    depends_on:
      pii-db:
        condition: service_healthy
      pii-migrate:
        condition: service_completed_successfully
    networks:
      # Both: pii-internal to reach its database, litellm so the guardrail
      # inside the LiteLLM container can reach it at http://pii-service:8090.
      - pii-internal
      - litellm
    expose:
      - "8090"
    # Uncomment only for local development. In a deployment the chat backend
    # and the guardrail both reach it over the docker network.
    # ports:
    #   - "127.0.0.1:8090:8090"

  # -------------------------------------------------------------------------
  # Web app: backend + UI (phases 2 and 3)
  # -------------------------------------------------------------------------

  pii-api-migrate:
    build:
      context: ./services/pii-api
      secrets: [pip_ca]
    image: pii-api:${PII_IMAGE_TAG:-0.1.0}
    container_name: pii-api-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      PII_API_DATABASE_URL: >-
        postgresql+psycopg://${PII_DB_USER:-pii}:${PII_DB_PASSWORD}@pii-db:5432/${PII_DB_NAME:-pii}
      PII_API_ADMIN_INITIAL_PASSWORD: ${PII_API_ADMIN_INITIAL_PASSWORD:?set it in .env}
      PII_API_LITELLM_MASTER_KEY: ${PII_API_LITELLM_MASTER_KEY:?set it in .env}
    depends_on:
      pii-db:
        condition: service_healthy
    networks:
      - pii-internal

  pii-api:
    build:
      context: ./services/pii-api
      secrets: [pip_ca]
    image: pii-api:${PII_IMAGE_TAG:-0.1.0}
    container_name: pii-api
    restart: unless-stopped
    environment:
      PII_API_DATABASE_URL: >-
        postgresql+psycopg://${PII_DB_USER:-pii}:${PII_DB_PASSWORD}@pii-db:5432/${PII_DB_NAME:-pii}
      PII_API_PII_SERVICE_URL: http://pii-service:8090
      # The same token pii-service takes, reused as a service-to-service
      # credential: pii-api authenticates the operator and forwards their
      # identity, so a policy change is attributed to a person rather than to
      # whoever holds the token. Leave PII_ADMIN_TOKEN empty and the Entities
      # screen reports itself disabled instead of failing obscurely.
      PII_API_PII_ADMIN_TOKEN: ${PII_ADMIN_TOKEN:-}
      PII_API_LITELLM_URL: ${PII_API_LITELLM_URL:-http://litellm:4000}
      # Mints one virtual key per app user, which is what puts a real user id
      # on every audit row the chat produces.
      PII_API_LITELLM_MASTER_KEY: ${PII_API_LITELLM_MASTER_KEY:?set it in .env}
      PII_API_CHAT_MODEL: ${PII_API_CHAT_MODEL:-local-llama}
      # Bootstraps the first admin, flagged must_change_password. The console
      # refuses to serve until that password is rotated.
      PII_API_ADMIN_EMAIL: ${PII_API_ADMIN_EMAIL:-admin@example.com}
      PII_API_ADMIN_INITIAL_PASSWORD: ${PII_API_ADMIN_INITIAL_PASSWORD:?set it in .env}
      # Local http development only. Leave true anywhere a browser reaches
      # this over anything but localhost.
      PII_API_COOKIE_SECURE: ${PII_API_COOKIE_SECURE:-true}
      PII_API_LOG_LEVEL: ${PII_LOG_LEVEL:-INFO}
    depends_on:
      pii-db:
        condition: service_healthy
      pii-api-migrate:
        condition: service_completed_successfully
      pii-service:
        condition: service_healthy
    networks:
      - pii-internal
      - litellm
    expose:
      - "8080"

  pii-web:
    build:
      context: ./services/pii-web
      secrets: [npm_ca]
    image: pii-web:${PII_IMAGE_TAG:-0.1.0}
    container_name: pii-web
    restart: unless-stopped
    depends_on:
      pii-api:
        condition: service_started
    networks:
      - pii-internal
    # The one published port of the whole stack. nginx serves the SPA and
    # proxies /api to pii-api, so the app is same-origin and the session
    # cookie needs no CORS relaxation.
    ports:
      - "${PII_WEB_BIND:-127.0.0.1}:${PII_WEB_PORT:-8099}:8081"

# Build-time only. Set PIP_CA_BUNDLE when an internal TLS-intercepting proxy
# sits in front of PyPI; the default is an empty file, which the Dockerfile
# treats as "no custom CA".
secrets:
  pip_ca:
    file: ${PIP_CA_BUNDLE:-/dev/null}
  # The same thing for the npm registry. Separate because a site may mirror one
  # and not the other, and because the two toolchains read different variables.
  npm_ca:
    file: ${NPM_CA_BUNDLE:-/dev/null}

volumes:
  pii-db-data:
  pii-wal:

networks:
  pii-internal:
    driver: bridge
  litellm:
    external: true
    name: ${LITELLM_NETWORK:-litellm}
