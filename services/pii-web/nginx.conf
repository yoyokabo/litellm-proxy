# Serves the built app and proxies /api to pii-api.
#
# Same-origin on purpose: the session is an httpOnly cookie, and putting the
# API on a different origin would mean CORS plus SameSite=None, which is a
# larger attack surface than a proxy_pass line.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nothing here is a secret, but nothing here should be cached as if the
    # deployment never changes either.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://pii-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The chat is an SSE stream. Without these three the reply arrives in
        # one lump when the response closes, which is the whole feature gone.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Single-page app: unknown paths are routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
