[project]
name = "pii-service"
version = "0.1.0"
description = "Arabic/English PII detection, masking and audit authority for the LiteLLM gateway"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    # Blank spaCy pipeline only -- no statistical model is ever downloaded, so
    # this stays air-gap friendly. See detect/nlp_engine.py.
    "spacy>=3.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Tier 2: ONNX int8 Arabic NER. onnxruntime + the Rust tokenizers binding only;
# installing torch or transformers into the runtime image is a packaging bug.
ner = [
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "numpy>=1.26",
]
# Tier 3: GLiNER2 for Latin script. Heavier, and off by default until
# scripts/benchmark.py says the latency is acceptable on the target CPU.
gliner = [
    "gliner>=0.2.13",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    # Lets the audit sink's batching, fail-open and WAL-replay logic be tested
    # against a real SQLAlchemy async engine without a Postgres container.
    "aiosqlite>=0.20",
    # A hung test must fail, not silently consume the whole CI run.
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_service"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
timeout = 60
filterwarnings = ["error::DeprecationWarning:pii_service.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",
    "ASYNC",
    "S",                # bandit
    "T20",              # no print() in the service
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"scripts/*" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pii_service"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "presidio_anonymizer.*", "spacy.*", "onnxruntime.*", "gliner.*"]
ignore_missing_imports = true
