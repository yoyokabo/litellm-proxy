[project]
name = "pii-service"
version = "0.1.0"
description = "Arabic/English PII detection, masking and audit authority for the LiteLLM gateway"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "presidio-analyzer>=2.2.355",
    # presidio-anonymizer is deliberately not a dependency: masking goes through
    # detect/mask.py, which works from already-deconflicted spans. See that module.

    # Blank spaCy pipeline only -- no statistical model is ever downloaded, so
    # this stays air-gap friendly. See detect/nlp_engine.py.
    "spacy>=3.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Tier 2: ONNX int8 Arabic NER. onnxruntime + the Rust tokenizers binding only;
# installing torch or transformers into the runtime image is a packaging bug.
ner = [
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "numpy>=1.26",
]
# Tier 3: GLiNER2 for Latin script.
#
# This pulls in torch AND transformers -- they are core dependencies of the
# gliner package, not optional ones, and its ONNX adapter imports torch too, so
# there is no configuration of it that avoids them. Installing this extra is
# therefore a deliberate trade: the supported upstream path, in exchange for a
# multi-gigabyte image and the end of the small `docker load` tarball.
#
# A deployment that does not enable tier 3 should not install it. See the
# Dockerfile, which gates it on a build argument for exactly that reason.
# Fetches and prepares model artifacts at deploy time, for a host that has
# internet. Only the bootstrap container needs this -- the service itself runs
# on [ner] plus, for tier 3, [gliner]. Kept separate so a site that bakes its
# weights into the image never installs a conversion toolchain.
bootstrap = [
    "optimum[onnxruntime]>=1.23",
    "transformers",
    "tiktoken",
    "protobuf",
    "sentencepiece",
]
gliner = [
    "gliner>=0.2.29",
    # gliner needs these to build the mdeberta-v3 tokenizer, and does not
    # declare them. Without them from_pretrained raises on a tiktoken import.
    "tiktoken",
    "protobuf",
    "sentencepiece",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    # Lets the audit sink's batching, fail-open and WAL-replay logic be tested
    # against a real SQLAlchemy async engine without a Postgres container.
    "aiosqlite>=0.20",
    # A hung test must fail, not silently consume the whole CI run.
    "pytest-timeout>=2.3",
    # Builds the deterministic stand-in token classifier in
    # tests/fake_ner_model.py, so tier 2's real ONNX path is covered without
    # downloading a checkpoint. Pair with the 'ner' extra: pip install -e ".[dev,ner]"
    "onnx>=1.16",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_service"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
timeout = 60
filterwarnings = ["error::DeprecationWarning:pii_service.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",
    "ASYNC",
    "S",                # bandit
    "T20",              # no print() in the service
]
ignore = [
    "S101",  # assert is fine in tests
    # This is an Arabic-language codebase. RUF001/2/3 flag every Arabic letter
    # and Arabic-Indic digit as "ambiguous" with a Latin lookalike, which here
    # means flagging the subject matter. Suppressed globally rather than with
    # hundreds of noqa comments that would bury a real finding.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
# Generates synthetic fixtures, deliberately with a seedable non-crypto RNG:
# reproducibility is the requirement, unpredictability is not.
"src/pii_service/synthetic.py" = ["S311"]
# An operator-facing CLI that happens to live in the package so it ships in the
# image. Printing progress is the whole job -- it runs as an init container and
# its stdout is what somebody reads while a 1.2 GB download goes by. Nothing in
# the request path imports it.
"src/pii_service/bootstrap.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pii_service"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "presidio_analyzer.*",
    "spacy.*",
    "onnxruntime.*",
    "gliner.*",
    # Optional tier-2/3 wheels, absent unless the extras are installed.
    "tokenizers.*",
    # Deploy-time only, and present only in a bootstrap image. The service
    # never imports these; pii_service.bootstrap does, inside a function.
    "optimum.*",
    "transformers.*",
]
ignore_missing_imports = true
