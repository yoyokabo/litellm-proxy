[project]
name = "pii-api"
version = "0.1.0"
description = "Backend for the PII chat and admin web app: auth, sessions, chat proxying, admin queries"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "structlog>=24.4",
    # Talks to pii-service and to the LiteLLM proxy. Nothing else leaves here.
    "httpx>=0.28",
]

# Deliberately absent: any password-hashing library. Hashing goes through
# hashlib.scrypt from the standard library -- see auth/passwords.py for why
# that is a considered choice and not a shortcut.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_api"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "T20"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pii_api"]
warn_unreachable = true
