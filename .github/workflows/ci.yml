name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only. The real pepper comes from a secrets manager at deploy time and
  # never from a repository file -- see README, "Generating the audit pepper".
  TEST_PEPPER: 0123456789abcdef0123456789abcdef

jobs:
  service:
    name: pii-service (lint, types, unit + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pii
          POSTGRES_PASSWORD: pii
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pii"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: services/pii-service

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv .venv
          # [ner] as well as [dev]: without onnxruntime the tier-2 inference
          # tests skip, and a silently skipped tier is the gap this suite exists
          # to close.
          uv pip install --python .venv/bin/python -e ".[dev,ner]"

      - name: Lint
        run: |
          .venv/bin/python -m ruff check src tests
          .venv/bin/python -m ruff format --check src tests

      - name: Types
        run: .venv/bin/python -m mypy

      - name: Unit tests
        run: .venv/bin/python -m pytest -q

      # The rest of the suite runs on SQLite. These are the tests that can only
      # tell the truth against the database we actually ship against: the
      # migration, the DESC indexes, BIGSERIAL, and psycopg's type round trip.
      - name: PostgreSQL integration tests
        env:
          PII_TEST_DATABASE_URL: postgresql+psycopg://pii:pii@localhost:5432/postgres
        run: .venv/bin/python -m pytest tests/test_postgres_integration.py -q

      - name: Benchmark smoke run
        run: cd ../.. && services/pii-service/.venv/bin/python scripts/benchmark.py --iterations 50

      # Proves the variant-comparison harness runs against real ONNX artifacts.
      # Uses deterministic stand-in models, not CAMeLBERT -- the real decision
      # needs real weights and is made by running the same command against
      # models/ (see README, "Choosing the CAMeLBERT variant").
      - name: NER comparison harness smoke run
        run: |
          cd ../..
          python - <<'PY'
          import re, sys
          from pathlib import Path
          sys.path.insert(0, "services/pii-service/src")
          sys.path.insert(0, "services/pii-service/tests")
          from fake_ner_model import build_fake_ner_model
          from pii_service.evaluation.gold import GoldSet, Register
          gold = GoldSet.load("services/pii-service/eval/arabic_ner_gold.yaml")
          word = re.compile(r"\w+", re.UNICODE)
          def labels(registers):
              out = {}
              for case in gold.cases:
                  if case.register not in registers:
                      continue
                  for span in case.spans:
                      for i, w in enumerate(word.findall(case.text[span.start:span.end])):
                          out.setdefault(w, f"{'B' if i == 0 else 'I'}-{span.label}")
              return out
          root = Path("/tmp/fakemodels")
          build_fake_ner_model(root / "camelbert-fake-mix-int8", word_labels=labels(set(Register)))
          build_fake_ner_model(root / "camelbert-fake-msa-int8", word_labels=labels({Register.MSA}))
          PY
          services/pii-service/.venv/bin/python scripts/eval_arabic_ner.py \
            --model /tmp/fakemodels/camelbert-fake-mix-int8 \
            --model /tmp/fakemodels/camelbert-fake-msa-int8

  guardrail:
    name: litellm guardrail (lint + contract tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/litellm-pii-guardrail

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python \
            litellm==1.101.0 pytest pytest-asyncio pytest-timeout respx httpx ruff

      - name: Lint
        run: cd ../.. && services/litellm-pii-guardrail/.venv/bin/python -m ruff check scripts services/litellm-pii-guardrail

      # These drive litellm's real translation handler. If a litellm upgrade
      # changes how apply_guardrail's return value is mapped back onto the
      # request, this is what catches it -- and the failure mode it guards
      # against is silent: masking that never reaches the model.
      - name: Contract tests
        run: .venv/bin/python -m pytest -q

  api:
    name: pii-api (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pii-api

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint
        run: |
          .venv/bin/python -m ruff check src tests
          .venv/bin/python -m ruff format --check src tests

      - name: Types
        run: .venv/bin/python -m mypy

      # The load-bearing test here is that the original text never reaches the
      # model. Everything else about the chat could work and that could still
      # be broken, and the product would be a PII leak with a chip above it.
      - name: Tests
        env:
          PII_API_ADMIN_INITIAL_PASSWORD: bootstrap-password-1
          PII_API_LITELLM_MASTER_KEY: sk-test-master
        run: .venv/bin/python -m pytest -q

  web:
    name: pii-web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pii-web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      # tsc runs in strict mode, so this is the type gate as well as the build.
      - name: Typecheck and build
        run: npm run build

  compose:
    name: docker compose builds and serves
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        run: |
          cp .env.example .env
          sed -i "s|^PII_AUDIT_PEPPER=.*|PII_AUDIT_PEPPER=$(openssl rand -hex 32)|" .env
          sed -i "s|^PII_DB_PASSWORD=.*|PII_DB_PASSWORD=$(openssl rand -hex 24)|" .env
          # pii-api refuses to start on the placeholder admin password, which
          # is the point of the check -- so CI generates one like a deployment
          # would. There is no LiteLLM here, so the master key is a stand-in;
          # the compose job never sends a completion.
          sed -i "s|^PII_API_ADMIN_INITIAL_PASSWORD=.*|PII_API_ADMIN_INITIAL_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=')|" .env
          sed -i "s|^PII_API_LITELLM_MASTER_KEY=.*|PII_API_LITELLM_MASTER_KEY=sk-ci-not-used|" .env

      - name: Validate the compose file
        run: docker compose config --quiet

      # The compose file attaches to a LiteLLM deployment it does not own, so
      # the network is external. CI has no LiteLLM, so it stands one in.
      - name: Create the external litellm network
        run: docker network create litellm

      - name: Build
        run: docker compose build

      - name: No PyTorch in the runtime image
        run: |
          docker compose run --rm --no-deps --entrypoint sh pii-service -c \
            'ls /opt/venv/lib/python3.11/site-packages | grep -qiE "^(torch|transformers)" && exit 1 || exit 0'

      - name: Up
        run: docker compose up -d --wait --wait-timeout 180

      - name: Migration reached head
        run: |
          docker compose exec -T pii-db \
            psql -U pii -d pii -tAc "SELECT version_num FROM alembic_version" | grep -q 0001_initial

      - name: Service answers and masks
        run: |
          docker compose exec -T pii-service python - <<'PY'
          import json, urllib.request
          body = json.dumps({
              "request_id": "ci-smoke",
              "texts": ["الرقم القومي 28503122148219"],
              "identity": {"user_id": "ci"},
          }).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:8090/analyze", data=body,
              headers={"content-type": "application/json"})
          result = json.load(urllib.request.urlopen(request, timeout=20))
          assert "28503122148219" not in result["texts"][0], result
          assert "<EG_NATIONAL_ID>" in result["texts"][0], result
          print("masked:", result["texts"][0])
          PY

      - name: An audit row landed, without the value
        run: |
          sleep 3
          docker compose exec -T pii-db psql -U pii -d pii -tAc \
            "SELECT entity_type, user_id, preview FROM pii_events" | tee /tmp/rows
          grep -q 'EG_NATIONAL_ID|ci|' /tmp/rows
          ! grep -q '28503122148219' /tmp/rows

      # The two migration chains share pii-db and must not collide: each keeps
      # its own version table, and a regression here shows up as one service
      # refusing to start because the other's revision id is unknown to it.
      - name: Both migration chains reached head
        run: |
          docker compose exec -T pii-db psql -U pii -d pii -tAc \
            "SELECT version_num FROM alembic_version" | grep -q 0001_initial
          docker compose exec -T pii-db psql -U pii -d pii -tAc \
            "SELECT version_num FROM alembic_version_api" | grep -q 0001_app_tables

      - name: The web app serves and its API is reachable
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:8099/
          # Unauthenticated admin access must be refused, not merely unlinked.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/admin/events)" = "401"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Down
        if: always()
        run: docker compose down -v
